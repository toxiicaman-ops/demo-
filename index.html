<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA — Ideas That Move Forward</title>
  <meta name="description"
    content="NOVA is a modern digital publication exploring technology, artificial intelligence, business, culture and the innovations shaping tomorrow.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,340;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    /* ============ RESET & BASE ============ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    :root {
      --bg: #FAF8F3;
      --surface: #F2EEE5;
      --surface-2: #E9E3D6;
      --surface-3: #DFD8C7;
      --ink: #15130E;
      --ink-soft: #5B5747;
      --ink-faint: #8A8570;
      --line: rgba(21, 19, 14, 0.13);
      --line-strong: rgba(21, 19, 14, 0.24);
      --accent: #4F2CE0;
      --accent-2: #DA3B2F;
      --accent-ink: #FBFAF6;
      --accent-soft: #ECE6FF;
      --shadow: 0 30px 60px -30px rgba(21, 19, 14, 0.35);
      --radius: 2px;
      --ff-display: 'Fraunces', Georgia, serif;
      --ff-body: 'Manrope', -apple-system, sans-serif;
      --ff-mono: 'Space Mono', monospace;
    }

    html[data-theme="dark"] {
      --bg: #0B0B0E;
      --surface: #141317;
      --surface-2: #1C1B21;
      --surface-3: #26242C;
      --ink: #F3F1EA;
      --ink-soft: #ABA7A0;
      --ink-faint: #726E68;
      --line: rgba(243, 241, 234, 0.12);
      --line-strong: rgba(243, 241, 234, 0.24);
      --accent: #9C86FF;
      --accent-2: #FF6B5B;
      --accent-ink: #0B0B0E;
      --accent-soft: rgba(156, 134, 255, 0.14);
      --shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.7);
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ff-body);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background .4s ease, color .4s ease;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
      object-fit: cover
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit
    }

    input,
    textarea,
    select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      background: none;
      border: none;
      outline: none
    }

    ul {
      list-style: none
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 40px
    }

    .mono {
      font-family: var(--ff-mono)
    }

    .eyebrow {
      font-family: var(--ff-mono);
      font-size: 11.5px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .eyebrow::before {
      content: '';
      width: 16px;
      height: 1px;
      background: var(--accent)
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--ff-display);
      font-weight: 500;
      letter-spacing: -.01em;
      line-height: 1.05
    }

    ::selection {
      background: var(--accent);
      color: var(--accent-ink)
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px
    }

    ::-webkit-scrollbar-track {
      background: var(--bg)
    }

    ::-webkit-scrollbar-thumb {
      background: var(--line-strong);
      border-radius: 8px
    }

    /* buttons */
    .btn {
      font-family: var(--ff-mono);
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 15px 28px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      transition: all .25s cubic-bezier(.4, 0, .2, 1);
      font-weight: 700;
    }

    .btn-primary {
      background: var(--ink);
      color: var(--bg)
    }

    html[data-theme="dark"] .btn-primary {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .btn-primary:hover {
      background: var(--accent);
      color: var(--accent-ink);
      transform: translateY(-2px)
    }

    .btn-outline {
      border: 1px solid var(--line-strong)
    }

    .btn-outline:hover {
      border-color: var(--ink);
      background: var(--surface);
      transform: translateY(-2px)
    }

    .btn-text {
      font-family: var(--ff-mono);
      font-size: 11.5px;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 700;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 3px;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      transition: gap .2s ease
    }

    .btn-text:hover {
      gap: 14px;
      color: var(--accent);
      border-color: var(--accent)
    }

    .btn-sm {
      padding: 9px 16px;
      font-size: 10.5px
    }

    /* ============ NAV ============ */
    #nav {
      position: sticky;
      top: 0;
      z-index: 200;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      transition: padding .3s ease, border-color .4s ease;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 40px;
      max-width: 1240px;
      margin: 0 auto;
      transition: padding .3s ease
    }

    #nav.scrolled .nav-inner {
      padding: 14px 40px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--ff-display);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -.01em
    }

    .logo-mark {
      width: 26px;
      height: 26px;
      position: relative;
      flex-shrink: 0
    }

    .logo-mark svg {
      width: 100%;
      height: 100%
    }

    .nav-links {
      display: flex;
      gap: 36px;
      align-items: center
    }

    .nav-links a {
      font-family: var(--ff-mono);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--ink-soft);
      position: relative;
      padding: 4px 0
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: width .25s ease
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--ink)
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 22px
    }

    .icon-btn {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: .85;
      transition: opacity .2s, transform .2s
    }

    .icon-btn:hover {
      opacity: 1;
      transform: scale(1.08)
    }

    .icon-btn svg {
      width: 100%;
      height: 100%
    }

    #hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      width: 24px;
      z-index: 300
    }

    #hamburger span {
      display: block;
      height: 1.5px;
      background: var(--ink);
      width: 100%;
      transition: all .3s ease
    }

    #hamburger.open span:nth-child(1) {
      transform: translateY(6.5px) rotate(45deg)
    }

    #hamburger.open span:nth-child(2) {
      opacity: 0
    }

    #hamburger.open span:nth-child(3) {
      transform: translateY(-6.5px) rotate(-45deg)
    }

    #mobile-menu {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 250;
      display: flex;
      flex-direction: column;
      padding: 100px 40px 40px;
      transform: translateY(-100%);
      transition: transform .45s cubic-bezier(.65, 0, .15, 1);
    }

    #mobile-menu.open {
      transform: translateY(0)
    }

    #mobile-menu a {
      font-family: var(--ff-display);
      font-size: 38px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line)
    }

    /* ============ HERO ============ */
    .hero {
      padding: 70px 0 110px;
      position: relative
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 70px;
      align-items: center
    }

    .hero h1 {
      font-size: clamp(48px, 6.4vw, 92px);
      margin: 26px 0 26px
    }

    .hero h1 em {
      font-style: normal;
      color: var(--accent)
    }

    .hero p.lead {
      font-size: 19px;
      color: var(--ink-soft);
      max-width: 460px;
      line-height: 1.6;
      margin-bottom: 38px
    }

    .hero-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap
    }

    .hero-visual {
      position: relative
    }

    .hero-visual .frame {
      position: absolute;
      inset: 18px -18px -18px 18px;
      border: 1.5px solid var(--accent);
      z-index: 0
    }

    .hero-visual img {
      position: relative;
      z-index: 1;
      width: 100%;
      aspect-ratio: 4/5;
      border-radius: var(--radius)
    }

    .hero-badge {
      position: absolute;
      bottom: -28px;
      left: -28px;
      background: var(--ink);
      color: var(--bg);
      padding: 22px 24px;
      z-index: 2;
      max-width: 220px;
      box-shadow: var(--shadow);
    }

    html[data-theme=dark] .hero-badge {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .hero-badge .num {
      font-family: var(--ff-display);
      font-size: 34px;
      line-height: 1
    }

    .hero-badge .lbl {
      font-family: var(--ff-mono);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .75;
      margin-top: 8px
    }

    /* ============ SECTION HEADERS ============ */
    .section {
      padding: 100px 0
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 56px;
      gap: 30px
    }

    .section-head h2 {
      font-size: clamp(30px, 3.6vw, 46px)
    }

    .section-head .eyebrow {
      margin-bottom: 14px
    }

    /* ============ FEATURED ============ */
    .featured {
      background: var(--surface);
      padding: 100px 0
    }

    .featured-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 60px;
      align-items: center
    }

    .featured-media {
      position: relative;
      overflow: hidden
    }

    .featured-media img {
      aspect-ratio: 5/4;
      transition: transform .8s cubic-bezier(.2, .8, .2, 1)
    }

    .featured-media:hover img {
      transform: scale(1.05)
    }

    .featured h3 {
      font-size: clamp(30px, 4vw, 50px);
      margin: 18px 0 22px
    }

    .featured .desc {
      color: var(--ink-soft);
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 30px;
      max-width: 480px
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 30px;
      flex-wrap: wrap
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0
    }

    .meta-row .who {
      font-family: var(--ff-mono);
      font-size: 12px;
      color: var(--ink-soft)
    }

    .meta-row .who b {
      color: var(--ink);
      font-weight: 700;
      display: block;
      font-size: 13px
    }

    .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--ink-faint)
    }

    /* ============ TRENDING ============ */
    .trend-list {
      border-top: 1px solid var(--line)
    }

    .trend-item {
      display: grid;
      grid-template-columns: 80px 1fr 140px 90px;
      gap: 30px;
      align-items: center;
      padding: 34px 0;
      border-bottom: 1px solid var(--line);
      transition: padding-left .3s ease, background .3s ease;
      cursor: pointer;
    }

    .trend-item:hover {
      padding-left: 16px;
      background: var(--surface)
    }

    .trend-num {
      font-family: var(--ff-display);
      font-size: 34px;
      color: var(--line-strong);
      font-style: italic
    }

    .trend-item:hover .trend-num {
      color: var(--accent)
    }

    .trend-body .cat {
      font-family: var(--ff-mono);
      font-size: 10.5px;
      letter-spacing: .1em;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px
    }

    .trend-body h4 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 6px
    }

    .trend-body p {
      color: var(--ink-soft);
      font-size: 14.5px;
      max-width: 520px
    }

    .trend-time {
      font-family: var(--ff-mono);
      font-size: 12px;
      color: var(--ink-faint);
      text-align: right
    }

    .trend-arrow {
      width: 18px;
      height: 18px;
      justify-self: end;
      opacity: .4;
      transition: opacity .3s, transform .3s
    }

    .trend-item:hover .trend-arrow {
      opacity: 1;
      transform: translateX(4px)
    }

    @media(max-width:720px) {
      .trend-item {
        grid-template-columns: 44px 1fr;
        row-gap: 8px
      }

      .trend-time,
      .trend-arrow {
        display: none
      }
    }

    /* ============ CATEGORIES ============ */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line)
    }

    .cat-card {
      background: var(--bg);
      padding: 44px 36px;
      transition: background .3s ease;
      cursor: pointer;
      min-height: 230px;
      display: flex;
      flex-direction: column
    }

    .cat-card:hover {
      background: var(--surface)
    }

    .cat-icon {
      width: 34px;
      height: 34px;
      color: var(--accent);
      margin-bottom: 22px
    }

    .cat-icon svg {
      width: 100%;
      height: 100%
    }

    .cat-card h4 {
      font-size: 21px;
      margin-bottom: 10px;
      font-weight: 500
    }

    .cat-card p {
      color: var(--ink-soft);
      font-size: 13.5px;
      line-height: 1.6;
      flex-grow: 1
    }

    .cat-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      font-family: var(--ff-mono);
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase
    }

    .cat-foot .cnt {
      color: var(--ink-faint)
    }

    @media(max-width:900px) {
      .cat-grid {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:560px) {
      .cat-grid {
        grid-template-columns: 1fr
      }
    }

    /* ============ ARTICLE GRID ============ */
    .art-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 44px 34px
    }

    .art-card {
      cursor: pointer;
      opacity: 0;
      transform: translateY(24px);
      animation: rise .7s cubic-bezier(.2, .7, .2, 1) forwards
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .art-media {
      overflow: hidden;
      position: relative;
      aspect-ratio: 4/3;
      margin-bottom: 20px
    }

    .art-media img {
      width: 100%;
      height: 100%;
      transition: transform .7s cubic-bezier(.2, .8, .2, 1)
    }

    .art-card:hover .art-media img {
      transform: scale(1.08)
    }

    .art-cat {
      font-family: var(--ff-mono);
      font-size: 10.5px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 10px;
      display: block
    }

    .art-card h4 {
      font-size: 22px;
      line-height: 1.2;
      margin-bottom: 10px;
      font-weight: 500;
      transition: color .2s
    }

    .art-card:hover h4 {
      color: var(--accent)
    }

    .art-card p {
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 16px
    }

    .art-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--ff-mono);
      font-size: 11.5px;
      color: var(--ink-faint)
    }

    .art-meta .avatar {
      width: 26px;
      height: 26px
    }

    @media(max-width:980px) {
      .art-grid {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:620px) {
      .art-grid {
        grid-template-columns: 1fr
      }
    }

    /* ============ NEWSLETTER ============ */
    .newsletter {
      background: var(--ink);
      color: var(--bg);
      padding: 110px 0;
      position: relative;
      overflow: hidden
    }

    html[data-theme=dark] .newsletter {
      background: var(--accent-soft);
      color: var(--ink)
    }

    .newsletter::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -8%;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      opacity: .5;
    }

    .nl-inner {
      position: relative;
      z-index: 1;
      max-width: 640px
    }

    .newsletter h2 {
      font-size: clamp(36px, 5vw, 60px);
      margin-bottom: 20px
    }

    .newsletter p {
      opacity: .7;
      font-size: 17px;
      max-width: 440px;
      margin-bottom: 40px;
      line-height: 1.6
    }

    .nl-form {
      display: flex;
      border-bottom: 1.5px solid currentColor;
      padding-bottom: 14px;
      gap: 20px;
      max-width: 520px
    }

    .nl-form input {
      flex: 1;
      font-size: 18px;
      font-family: var(--ff-display);
      background: transparent;
      color: inherit
    }

    .nl-form input::placeholder {
      color: currentColor;
      opacity: .4
    }

    .nl-form button {
      font-family: var(--ff-mono);
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .nl-privacy {
      font-family: var(--ff-mono);
      font-size: 11px;
      opacity: .5;
      margin-top: 16px
    }

    /* ============ FOOTER ============ */
    footer {
      padding: 80px 0 30px;
      border-top: 1px solid var(--line)
    }

    .foot-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
      gap: 50px;
      padding-bottom: 60px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 30px
    }

    .foot-brand p {
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.7;
      margin: 20px 0 24px;
      max-width: 280px
    }

    .foot-social {
      display: flex;
      gap: 14px
    }

    .foot-social a {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s
    }

    .foot-social a:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff
    }

    .foot-social svg {
      width: 15px;
      height: 15px
    }

    .foot-col h5 {
      font-family: var(--ff-mono);
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 20px
    }

    .foot-col a,
    .foot-col span {
      display: block;
      font-size: 14px;
      color: var(--ink-soft);
      padding: 7px 0;
      transition: color .2s
    }

    .foot-col a:hover {
      color: var(--accent)
    }

    .foot-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      font-family: var(--ff-mono);
      font-size: 11.5px;
      color: var(--ink-faint)
    }

    .foot-bottom .legal {
      display: flex;
      gap: 24px
    }

    .foot-bottom a:hover {
      color: var(--ink)
    }

    @media(max-width:800px) {
      .foot-grid {
        grid-template-columns: 1fr 1fr
      }
    }

    /* ============ ARTICLE PAGE ============ */
    #progress {
      position: fixed;
      top: 0;
      left: 0;

    .about-mission .big {

    .admin-side a.active {
      color: var(--ink);
      border-color: var(--accent);
      background: var(--surface)
    }

    .admin-main {
      padding: 44px 46px;
      overflow-x: auto
    }

    .admin-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      flex-wrap: wrap;
      gap: 16px
    }

    .admin-head h2 {
      font-size: 30px
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      margin-bottom: 50px

    .stat-card {

      padding: 26px
    }

      font-family: var(--ff-display);
      font-size: 38px

      font-family: var(--ff-mono);
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--ink-faint);
      letter-spacing: .06em;
      margin-top: 6px

      background: var(--surface-3);
      color: var(--ink-soft)

      gap: 14px

      font-size: 11px;
      text-transform: uppercase;

      justify-content: center;

      overflow-y: auto

      max-width: 680px;
      width: 100%;
      padding: 44px;
      box-shadow: var(--shadow)
    }

      font-size: 26px;
      margin-bottom: 30px

      grid-template-columns: 1fr 1fr;
      gap: 20px
    }

    .mfield {
      margin-bottom: 20px
    }

    .mfield.full {
      grid-column: 1/-1
    }

    .mfield label {
      font-family: var(--ff-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-faint);
      display: block;
      margin-bottom: 8px
    }

    .mfield input,
    .mfield select,
    .mfield textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      padding: 11px 12px;
      font-size: 14px;
      background: var(--surface)

    .mfield textarea {
      resize: vertical;
      min-height: 100px
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 30px;
      flex-wrap: wrap
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--ff-mono);
      font-size: 12px
    }

    /* ============ TOAST ============ */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: var(--ink);
      color: var(--bg);
      padding: 16px 26px;
      font-family: var(--ff-mono);
      font-size: 12.5px;
      z-index: 500;
      transition: transform .4s cubic-bezier(.2, .8, .2, 1);
      letter-spacing: .03em
    }

    #toast.show {
      transform: translateX(-50%) translateY(0)
    }

    /* ============ UTIL / REVEAL ============ */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity .8s cubic-bezier(.2, .7, .2, 1), transform .8s cubic-bezier(.2, .7, .2, 1)
    }

    .reveal.show {
      opacity: 1;
      transform: translateY(0)
    }

    .empty-note {
      font-family: var(--ff-mono);
      font-size: 12.5px;
      color: var(--ink-faint);
      text-align: center;
      padding: 60px 0
    }

    /* ============ RESPONSIVE ============ */
    @media(max-width:980px) {
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 50px
      }

      .hero-visual {
        order: -1;
        max-width: 420px
      }

      .featured-grid {
        grid-template-columns: 1fr;
        gap: 36px
      }

      .art-grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .admin-shell {
        grid-template-columns: 1fr
      }

      .admin-side {
        display: flex;
        overflow-x: auto;
        padding: 16px;
        border-right: none;
        border-bottom: 1px solid var(--line)
      }

      .admin-side a {
        padding: 10px 16px;
        white-space: nowrap;
        border-left: none;
        border-bottom: 2px solid transparent
      }

      .admin-side a.active {
        border-color: var(--accent)
      }
    }

    @media(max-width:720px) {
      .wrap {
        padding: 0 22px
      }

      .nav-links {
        display: none
      }

      #hamburger {
        display: flex
      }

      .nav-right .icon-btn.search-desktop {
        display: none
      }

      .section {
        padding: 70px 0
      }

      .featured,
      .newsletter {
        padding: 70px 0
      }

      .foot-grid {
        grid-template-columns: 1fr
      }

      .mgrid {
        grid-template-columns: 1fr
      }

      .stat-grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .art-toolbar {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start
      }
    }
  </style>
</head>

          <div class="icon-btn" style="width:34px;height:34px;border:1px solid var(--line-strong);border-radius:50%;display:flex;align-items:center;justify-content:center">𝕏</div>
          <div class="icon-btn" style="width:34px;height:34px;border:1px solid var(--line-strong);border-radius:50%;display:flex;align-items:center;justify-content:center">in</div>
        </div>

  </div>
  <section class="section wrap reveal" style="padding-top:0">
    <div class="section-head"><div><span class="eyebrow">${arts.length} Articles</span><h2>Written by ${au.name}</h2></div></div>
    ${arts.length ? `<div class="art-grid">${arts.map(articleCard).join('')}</div>` : `<p class="empty-note">No published articles yet.</p>`}
  </section>
  ${footerHtml()}
  `;
      afterRender();
    }

    /* ================= ABOUT ================= */
    function renderAbout() {
      app.innerHTML = `
  <div class="wrap about-mission">
    <span class="eyebrow">About Nova</span>
    <h1>A modern publication for people who read the future closely.</h1>
    <p class="big">NOVA is a modern digital publication focused on exploring the ideas and technology shaping what comes next — technology, business, culture and the quiet infrastructure underneath all three.</p>
  </div>

  <section class="wrap reveal" style="padding-bottom:90px">

    <p style="max-width:680px;color:var(--ink-soft);font-size:17px;line-height:1.75">To make complex ideas interesting, understandable and worth discussing. We report on the technology and decisions shaping the next decade with the same care a good editor gives a difficult sentence — cut until only what matters remains.</p>

      <div class="value-card"><div class="num">02</div><h4>Curiosity first</h4><p>Every story starts from a genuine question, not a predetermined conclusion.</p></div>

  <section class="wrap reveal" style="padding-bottom:100px">
    <div class="section-head"><div><span class="eyebrow">The people behind Nova</span><h2>Meet the Team</h2></div></div>
    <div class="team-grid">
      ${AUTHORS.map(a => `<div class="team-card" onclick="go(event,'/author/${a.slug}')">
        <img class="avatar" src="${a.avatar}" alt="${a.name}">
        <h5>${a.name}</h5>
        <span>${a.role}</span>

  </section>

    /* ================= CONTACT ================= */
    function renderContact() {
      app.innerHTML = `
  <div class="page-head wrap">
    <span class="eyebrow">Get in touch</span>
    <h1>Contact Nova</h1>
    <p>Questions, pitches or partnership ideas — we read everything that comes through.</p>
  </div>
  <div class="wrap contact-grid">

      <h4>Editorial</h4><div class="val">editors@nova.pub</div>
      <h4>General inquiries</h4><div class="val">hello@nova.pub</div>
      <h4>Follow Nova</h4>
      <div class="foot-social" style="margin-top:14px">
        <a href="#" title="X">𝕏</a><a href="#" title="LinkedIn">in</a><a href="#" title="Instagram">◎</a>
      </div>
    </div>
  </div>
  ${footerHtml()}
  `;
      afterRender();
    }
    function handleContact(e) { e.preventDefault(); toast("Message sent — we'll be in touch soon."); e.target.reset(); }

    /* ================= SEARCH ================= */
    let searchState = { q: '', cat: 'all' };
    function renderSearch() {
      app.innerHTML = `
  <div class="page-head wrap" style="padding-bottom:20px">
    <span class="eyebrow">Search Nova</span>
    <h1>Find a story</h1>
  </div>
  <div class="wrap">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="Search by keyword, topic or author..." value="${searchState.q}" oninput="onSearchInput(this.value)">
    </div>
    <div class="filters" id="filters">
      <button class="filter-chip ${searchState.cat === 'all' ? 'active' : ''}" onclick="setSearchCat('all')">All</button>
      ${CATEGORIES.map(c => `<button class="filter-chip ${searchState.cat === c.slug ? 'active' : ''}" onclick="setSearchCat('${c.slug}')">${c.name}</button>`).join('')}
    </div>
    <div id="search-results-wrap"></div>
  </div>
  ${footerHtml()}
  `;
      renderSearchResults();
      afterRender();
      setTimeout(() => $('#search-input') && $('#search-input').focus(), 50);
    }
    function onSearchInput(v) { searchState.q = v; renderSearchResults(); }
    function setSearchCat(c) { searchState.cat = c; renderSearch(); }
    function renderSearchResults() {
      const q = searchState.q.trim().toLowerCase();
      let results = published();
      if (searchState.cat !== 'all') results = results.filter(a => a.category === searchState.cat);
      if (q) results = results.filter(a => {
        const au = authorBySlug(a.author);
        return a.title.toLowerCase().includes(q) || a.excerpt.toLowerCase().includes(q) || au.name.toLowerCase().includes(q) || a.tags.some(t => t.toLowerCase().includes(q));
      });
      const wrap = $('#search-results-wrap');
      if (!wrap) return;
      wrap.innerHTML = `<div class="search-count">${results.length} result${results.length !== 1 ? 's' : ''}</div>
  <div class="search-results">
  ${results.map(a => {
        const au = authorBySlug(a.author);
        return `<div class="sres" onclick="go(event,'/article/${a.slug}')">
      <img src="${a.image}" alt="">
      <div><h4>${a.title}</h4><p>${catByslug(a.category).name} · ${au.name} · ${a.readTime} read</p></div>
    </div>`;
      }).join('') || `<p class="empty-note">No stories match your search.</p>`}
  </div>`;
    }

    /* ================= NEWSLETTER (shared) ================= */
    function newsletterSection() {
      return `
  <section class="newsletter" id="newsletter">
    <div class="wrap nl-inner">
      <span class="eyebrow" style="color:inherit;opacity:.7">Weekly digest</span>
      <h2>Stay Curious.</h2>
      <p>Get thoughtful stories about technology, ideas and the future delivered directly to your inbox.</p>
      <form class="nl-form" onsubmit="handleSubscribe(event)">
        <input type="email" required placeholder="Email address">
        <button type="submit">Subscribe →</button>
      </form>
      <p class="nl-privacy">We respect your inbox. One email a week, unsubscribe anytime. No data sold, ever.</p>
    </div>
  </section>`;
    }
    function handleSubscribe(e) {
      e.preventDefault();
      const input = e.target.querySelector('input');
      SUBSCRIBERS.unshift({ email: input.value, date: new Date().toISOString().slice(0, 10) });
      toast('Subscribed! Welcome to Nova.');
      e.target.reset();
    }

    /* ================= FOOTER (shared) ================= */
    function footerHtml() {
      return `
  <footer>
    <div class="wrap">
      <div class="foot-grid">
        <div class="foot-brand">
          <div class="logo" style="font-size:22px">
            <span class="logo-mark"><svg viewBox="0 0 30 30" fill="none"><path d="M15 1L18.5 11.5L29 15L18.5 18.5L15 29L11.5 18.5L1 15L11.5 11.5L15 1Z" fill="currentColor"/></svg></span>
            NOVA
          </div>
          <p>A modern digital publication exploring the technology, ideas and culture shaping what comes next.</p>
          <div class="foot-social">
            <a href="#" title="X">𝕏</a><a href="#" title="LinkedIn">in</a><a href="#" title="Instagram">◎</a>
          </div>
        </div>
        <div class="foot-col">
          <h5>Categories</h5>
          ${CATEGORIES.map(c => `<a href="#/category/${c.slug}" onclick="go(event,'/category/${c.slug}')">${c.name}</a>`).join('')}
        </div>
        <div class="foot-col">
          <h5>Company</h5>
          <a href="#/about" onclick="go(event,'/about')">About</a>
          <a href="#/contact" onclick="go(event,'/contact')">Contact</a>
          <a href="#/admin" onclick="go(event,'/admin')">Admin</a>
          <a href="#/search" onclick="go(event,'/search')">Search</a>
        </div>
        <div class="foot-col">
          <h5>Newsletter</h5>

          <form onsubmit="handleSubscribe(event)" style="margin-top:12px;border-bottom:1px solid var(--line-strong);display:flex;padding-bottom:8px">

    }

    /* ================= 404 ================= */
    function renderNotFound() {
      app.innerHTML = `<div class="wrap page-head" style="padding:160px 0">
    <span class="eyebrow">404</span>
    <h1>This story doesn't exist.</h1>
    <p style="margin-bottom:30px">The page you're looking for may have moved or never existed.</p>
    <button class="btn btn-primary" onclick="go(event,'/')">Back to Home</button>
  </div>${footerHtml()}`;
      afterRender();
    }

    /* ================= ADMIN ================= */
    let adminEditingId = null;
    function adminNav(active) {
      const items = [['dashboard', 'Dashboard'], ['articles', 'Articles'], ['categories', 'Categories'], ['authors', 'Authors'], ['subscribers', 'Subscribers']];
      return `<div class="admin-side">${items.map(([k, l]) => `<a href="#/admin/${k}" class="${active === k ? 'active' : ''}" onclick="go(event,'/admin/${k}')">${l}</a>`).join('')}</div>`;
    }
    function renderAdmin(path) {
      const sub = path.split('/admin/')[1] || 'dashboard';
      let main = '';
      if (sub === 'dashboard') main = adminDashboard();
      else if (sub === 'articles') main = adminArticles();
      else if (sub === 'categories') main = adminCategories();
      else if (sub === 'authors') main = adminAuthors();
      else if (sub === 'subscribers') main = adminSubscribers();
      else main = adminDashboard();

      app.innerHTML = `
  <div class="wrap" style="padding:30px 40px 0"><span class="eyebrow">CMS</span></div>
  <div class="admin-shell wrap" style="padding-top:10px">
    ${adminNav(sub === 'dashboard' ? 'dashboard' : sub)}
    <div class="admin-main">${main}</div>
  </div>`;
      afterRender();
    }
    function adminDashboard() {
      const pubCount = published().length, draftCount = ARTICLES.filter(a => a.status === 'draft').length;
      return `
  <div class="admin-head"><h2>Dashboard</h2></div>
  <div class="stat-grid">
    <div class="stat-card"><div class="n">${ARTICLES.length}</div><div class="l">Total Articles</div></div>
    <div class="stat-card"><div class="n">${pubCount}</div><div class="l">Published</div></div>
    <div class="stat-card"><div class="n">${draftCount}</div><div class="l">Drafts</div></div>
    <div class="stat-card"><div class="n">${SUBSCRIBERS.length}</div><div class="l">Subscribers</div></div>
  </div>
  <div class="section-head"><div><h2 style="font-size:22px">Recent Articles</h2></div><button class="btn btn-primary btn-sm" onclick="openArticleModal()">+ New Article</button></div>
  ${adminTable(ARTICLES.slice(0, 5))}
  `;
    }
    function adminArticles() {
      return `
  <div class="admin-head"><h2>Articles</h2><button class="btn btn-primary btn-sm" onclick="openArticleModal()">+ New Article</button></div>
  ${adminTable(ARTICLES)}
  `;
    }
    function adminTable(list) {
      if (!list.length) return `<div class="admin-empty">No articles yet. Create your first one.</div>`;
      return `<table><thead><tr><th>Title</th><th>Category</th><th>Author</th><th>Status</th><th>Date</th><th></th></tr></thead>
  <tbody>
  ${list.map(a => {
        const au = authorBySlug(a.author), cat = catByslug(a.category);
        return `<tr>
      <td><b>${a.title}</b>${a.featured ? ' <span class="mono" style="color:var(--accent);font-size:10px">★ FEATURED</span>' : ''}</td>
      <td>${cat.name}</td>
      <td>${au.name}</td>
      <td><span class="pill ${a.status}">${a.status}</span></td>
      <td class="mono" style="font-size:12px">${fmtDate(a.date)}</td>
      <td><div class="row-actions">
        <button onclick="openArticleModal(${a.id})">Edit</button>
        <button onclick="toggleStatus(${a.id})">${a.status === 'published' ? 'Unpublish' : 'Publish'}</button>
        <button onclick="deleteArticle(${a.id})">Delete</button>
      </div></td>
    </tr>`;
      }).join('')}
  </tbody></table>`;
    }
    function adminCategories() {
      return `<div class="admin-head"><h2>Categories</h2></div>
  <table><thead><tr><th>Category</th><th>Slug</th><th>Articles</th></tr></thead><tbody>
  ${CATEGORIES.map(c => `<tr><td><b>${c.name}</b></td><td class="mono">${c.slug}</td><td>${published().filter(a => a.category === c.slug).length}</td></tr>`).join('')}
  </tbody></table>`;
    }
    function adminAuthors() {
      return `<div class="admin-head"><h2>Authors</h2></div>
  <table><thead><tr><th>Author</th><th>Role</th><th>Articles</th></tr></thead><tbody>
  ${AUTHORS.map(a => `<tr><td style="display:flex;align-items:center;gap:12px"><img class="avatar" style="width:32px;height:32px" src="${a.avatar}"><b>${a.name}</b></td><td>${a.role}</td><td>${published().filter(x => x.author === a.slug).length}</td></tr>`).join('')}
  </tbody></table>`;
    }
    function adminSubscribers() {
      return `<div class="admin-head"><h2>Subscribers</h2></div>
  <table><thead><tr><th>Email</th><th>Subscribed</th></tr></thead><tbody>
  ${SUBSCRIBERS.map(s => `<tr><td>${s.email}</td><td class="mono" style="font-size:12px">${fmtDate(s.date)}</td></tr>`).join('') || `<tr><td colspan="2" class="admin-empty">No subscribers yet.</td></tr>`}
  </tbody></table>`;
    }
    function toggleStatus(id) {
      const a = ARTICLES.find(x => x.id === id);
      a.status = a.status === 'published' ? 'draft' : 'published';
      toast(`Article ${a.status === 'published' ? 'published' : 'moved to drafts'}.`);
      render();
    }
    function deleteArticle(id) {
      ARTICLES = ARTICLES.filter(a => a.id !== id);
      toast('Article deleted.');
      render();
    }
    function openArticleModal(id) {
      adminEditingId = id || null;
      const a = id ? ARTICLES.find(x => x.id === id) : null;
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'article-modal';
      overlay.innerHTML = `
  <div class="modal">
    <h3>${a ? 'Edit Article' : 'New Article'}</h3>
    <form onsubmit="saveArticle(event)">
      <div class="mgrid">
        <div class="mfield full"><label>Title</label><input id="f-title" required value="${a ? a.title : ''}"></div>
        <div class="mfield full"><label>Subtitle</label><input id="f-subtitle" value="${a ? a.subtitle : ''}"></div>
        <div class="mfield"><label>Slug</label><input id="f-slug" value="${a ? a.slug : ''}" placeholder="auto-generated-if-blank"></div>
        <div class="mfield"><label>Cover Image URL</label><input id="f-image" value="${a ? a.image : 'https://picsum.photos/seed/' + Date.now() + '/1200/800'}"></div>
        <div class="mfield"><label>Category</label><select id="f-category">${CATEGORIES.map(c => `<option value="${c.slug}" ${a && a.category === c.slug ? 'selected' : ''}>${c.name}</option>`).join('')}</select></div>
        <div class="mfield"><label>Author</label><select id="f-author">${AUTHORS.map(x => `<option value="${x.slug}" ${a && a.author === x.slug ? 'selected' : ''}>${x.name}</option>`).join('')}</select></div>
        <div class="mfield"><label>Publication Date</label><input id="f-date" type="date" value="${a ? a.date : new Date().toISOString().slice(0, 10)}"></div>
        <div class="mfield"><label>Reading Time</label><input id="f-readtime" value="${a ? a.readTime : '5 min'}"></div>
        <div class="mfield full"><label>Tags (comma separated)</label><input id="f-tags" value="${a ? a.tags.join(', ') : ''}"></div>
        <div class="mfield full"><label>Content / Excerpt</label><textarea id="f-content">${a ? a.excerpt : ''}</textarea></div>
        <div class="mfield"><label>SEO Title</label><input id="f-seo-title" value="${a ? a.title : ''}"></div>
        <div class="mfield"><label>SEO Description</label><input id="f-seo-desc" value="${a ? a.excerpt.slice(0, 120) : ''}"></div>
        <div class="mfield"><div class="toggle-row"><input type="checkbox" id="f-featured" ${a && a.featured ? 'checked' : ''}> <label style="margin:0">Featured Article</label></div></div>
        <div class="mfield"><div class="toggle-row"><input type="checkbox" id="f-published" ${a && a.status === 'published' ? 'checked' : ''}> <label style="margin:0">Publish immediately</label></div></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline btn-sm" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm">${a ? 'Save Changes' : 'Create Article'}</button>
      </div>
    </form>
  </div>`;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    }
    function closeModal() { const m = $('#article-modal'); if (m) m.remove(); }
    function saveArticle(e) {
      e.preventDefault();
      const title = $('#f-title').value.trim();
      let slug = $('#f-slug').value.trim() || title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      const featured = $('#f-featured').checked;
      const data = {
        title, slug,
        subtitle: $('#f-subtitle').value,
        image: $('#f-image').value,
        category: $('#f-category').value,
        author: $('#f-author').value,
        date: $('#f-date').value,
        readTime: $('#f-readtime').value,
        tags: $('#f-tags').value.split(',').map(t => t.trim()).filter(Boolean),
        excerpt: $('#f-content').value,
        status: $('#f-published').checked ? 'published' : 'draft',
        featured,
      };
      if (featured) ARTICLES.forEach(a => a.featured = false);

      if (adminEditingId) {
        const idx = ARTICLES.findIndex(a => a.id === adminEditingId);
        ARTICLES[idx] = { ...ARTICLES[idx], ...data, content: ARTICLES[idx].content };
        toast('Article updated.');
      } else {
        ARTICLES.unshift({ ...data, id: Date.now(), content: [{ t: 'p', v: data.excerpt || 'New story — content coming soon.' }] });
        toast('Article created.');
      }
      closeModal();
      render();
    }

    /* ================= THEME + MOBILE MENU ================= */
    function toggleMobile() {
      $('#hamburger').classList.toggle('open');
      $('#mobile-menu').classList.toggle('open');
    }
    $('#theme-toggle').addEventListener('click', () => {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
    });

    /* nav scroll shadow */
    window.addEventListener('scroll', () => {
      $('#nav').classList.toggle('scrolled', window.scrollY > 10);
    });

    /* ================= REVEAL ON SCROLL ================= */
    function afterRender() {
      const io = new IntersectionObserver(entries => {
        entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('show'); io.unobserve(en.target); } });
      }, { threshold: 0.12 });
      document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    }

    /* ================= INIT ================= */
    render();
  </script>
</body>

</html>
